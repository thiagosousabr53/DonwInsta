<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixar vídeo do Instagram</title>
<meta name="description" content="Cole o link de um reel ou post público e baixe o vídeo em MP4.">
<!-- AdSense: troque ca-pub-XXXXXXXXXXXXXXXX pelo seu ID depois da aprovação
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
-->
<style>
:root{--bg:#f7f3fb;--card:#fff;--tx:#1d1530;--mut:#6b6280;--ac:#7c3aed;--ac2:#db2777;--bd:#e4dcf0;--er:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#150f22;--card:#211833;--tx:#f3eefb;--mut:#a79bc0;--bd:#3a2d55;--er:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:28px 18px 40px}
h1{font-size:1.9rem;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
p.sub{margin:0 0 22px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
input[type=url]{width:100%;font:inherit;padding:14px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:inherit}
input[type=url]:focus,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;color:#fff;border:0;border-radius:12px;padding:14px;background:linear-gradient(90deg,var(--ac),var(--ac2));cursor:pointer}
button:disabled{opacity:.6}
label.ok{display:flex;gap:10px;margin-top:12px;font-size:.88rem;color:var(--mut)}
#msg{margin-top:14px;min-height:1.4em}
#msg.erro{color:var(--er)}
#res{display:none;margin-top:14px}
#res a{display:block;text-align:center;text-decoration:none;font-weight:600;color:#fff;background:var(--ac);padding:14px;border-radius:12px;margin-top:10px}
.ad{margin:18px 0;min-height:90px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--bd);border-radius:12px;color:var(--mut);font-size:.8rem}
footer{margin-top:26px;font-size:.8rem;color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>Baixar vídeo do Instagram</h1>
  <p class="sub">Cole o link de um reel ou post público e baixe em MP4.</p>

  <div class="ad" id="ad-topo"><!-- bloco de anúncio: topo --></div>

  <div class="card">
    <input id="url" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/..." autocomplete="off">
    <label class="ok"><input id="ok" type="checkbox"> Tenho permissão do autor ou uso apenas para fins pessoais, respeitando os direitos autorais.</label>
    <button id="btn">Buscar vídeo</button>
    <div id="msg" role="status"></div>
    <div id="res"><strong id="tit"></strong><a id="dl" href="#">Baixar MP4</a></div>
  </div>

  <div class="ad" id="ad-meio"><!-- bloco de anúncio: meio --></div>

  <footer>Não é afiliado ao Instagram. Funciona apenas com conteúdo público. Você é responsável pelo uso dos vídeos baixados.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const msg = (t, erro) => { $("msg").textContent = t; $("msg").className = erro ? "erro" : ""; };

$("btn").onclick = async () => {
  const url = $("url").value.trim();
  $("res").style.display = "none";
  if (!url) return msg("Cole o link do vídeo.", true);
  if (!$("ok").checked) return msg("Confirme a caixa de permissão para continuar.", true);
  $("btn").disabled = true; msg("Buscando vídeo...");
  try {
    const r = await fetch("/api/info", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.erro);
    $("tit").textContent = d.titulo;
    $("dl").href = "/api/baixar?url=" + encodeURIComponent(url);
    $("res").style.display = "block"; msg("");
  } catch (e) {
    msg(e.message || "Algo deu errado. Tente novamente.", true);
  } finally { $("btn").disabled = false; }
};
</script>
</body>
</html>
